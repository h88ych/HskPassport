<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="stampThaiTitle stampThaiDesc">
  <title id="stampThaiTitle">Trip 04 Thailand Passport Stamp</title>
  <desc id="stampThaiDesc">A collectible pastel passport stamp featuring Wat Arun, a cute elephant, a tuk-tuk, and a floating market boat.</desc>
  <defs>
    <!-- Sky Gradient matching the pastel lavender/mint series -->
    <linearGradient id="stampThaiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F5"/>
      <stop offset=".55" stop-color="#F5F1FF"/>
      <stop offset="1" stop-color="#E0F7FA"/>
    </linearGradient>
    
    <filter id="stampThaiShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#665B88" flood-opacity=".18"/>
    </filter>
    
    <pattern id="stampThaiTexture" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.2" fill="#2B2540" opacity=".08"/>
      <circle cx="13" cy="11" r=".9" fill="#2B2540" opacity=".07"/>
    </pattern>
    
    <clipPath id="stampThaiClip">
      <circle cx="110" cy="110" r="96.5"/>
    </clipPath>
  </defs>

  <!-- Collectible stamp base (Matched sizes to Japan/China stamps) -->
  <circle cx="110" cy="110" r="104" fill="#FFFFFF" filter="url(#stampThaiShadow)"/>
  <circle cx="110" cy="110" r="100" fill="url(#stampThaiBg)" stroke="#A38AF5" stroke-width="7"/>
  <circle cx="110" cy="110" r="88" fill="none" stroke="#FF88AE" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round"/>
  <circle cx="110" cy="110" r="78" fill="#FFFFFF" opacity=".42"/>
  
  <g clip-path="url(#stampThaiClip)">
    <!-- Base Texture overlay -->
    <rect x="8" y="8" width="204" height="204" fill="url(#stampThaiTexture)"/>
    
    <!-- Sun and Clouds -->
    <circle cx="160" cy="50" r="22" fill="#FFD166" opacity=".3"/>
    <path d="M 140 40 a 8 8 0 0 1 16 0 a 12 12 0 0 1 20 0 a 8 8 0 0 1 8 8 h -44 a 8 8 0 0 1 0 -8 Z" fill="#FFFFFF" opacity=".8"/>
    <path d="M 40 60 a 10 10 0 0 1 20 0 a 15 15 0 0 1 25 0 a 10 10 0 0 1 10 10 h -55 a 10 10 0 0 1 0 -10 Z" fill="#FFFFFF" opacity=".8"/>

    <!-- Tropical Palm Tree -->
    <g transform="translate(0 15)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <path d="M 20 90 Q 15 50, 25 20 Q 20 50, 12 90 Z" fill="#FFB199"/>
      <path d="M 25 20 Q 5 10, -10 25 Q 5 25, 25 20 Z" fill="#7FE7C4"/>
      <path d="M 25 20 Q 15 -10, 0 -15 Q 15 5, 25 20 Z" fill="#9DB4FF"/>
      <path d="M 25 20 Q 45 -5, 55 5 Q 40 15, 25 20 Z" fill="#7FE7C4"/>
      <path d="M 25 20 Q 50 25, 45 45 Q 35 30, 25 20 Z" fill="#9DB4FF"/>
      <circle cx="20" cy="25" r="4.5" fill="#FFD166"/>
      <circle cx="30" cy="28" r="4.5" fill="#FFD166"/>
    </g>

    <!-- Wat Arun (Temple) -->
    <g transform="translate(50 -10)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <!-- Center Prang -->
      <path d="M 45 110 h 30 l -5 -20 h -20 Z" fill="#FFFFFF"/>
      <path d="M 50 90 h 20 l -5 -20 h -10 Z" fill="#FFB199"/>
      <path d="M 55 70 h 10 l -5 -40 Z" fill="#FFFFFF"/>
      <path d="M 60 30 v -15 m -5 5 h 10" fill="none" stroke="#FFD166"/>
      <!-- Left Prang -->
      <path d="M 25 110 h 16 l -4 -15 h -8 Z" fill="#FFFFFF"/>
      <path d="M 29 95 h 8 l -4 -25 Z" fill="#FFB199"/>
      <!-- Right Prang -->
      <path d="M 79 110 h 16 l -4 -15 h -8 Z" fill="#FFFFFF"/>
      <path d="M 83 95 h 8 l -4 -25 Z" fill="#FFB199"/>
      <!-- Base Steps -->
      <path d="M 15 120 h 90 l -5 -10 h -80 Z" fill="#FFD166"/>
      <path d="M 5 130 h 110 l -5 -10 h -100 Z" fill="#FF8FB1"/>
    </g>

    <!-- Layers of Land and River -->
    <path d="M -10 110 Q 110 130 230 110 L 230 220 L -10 220 Z" fill="#DDF8EE"/>
    <path d="M -10 115 Q 110 135 230 115 L 230 145 Q 110 165 -10 145 Z" fill="#BDE0FE"/>
    <path d="M -10 145 Q 110 165 230 145 L 230 220 L -10 220 Z" fill="#A8E6CF"/>

    <!-- Floating Market Boat -->
    <g transform="translate(60 118)" stroke="#2B2540" stroke-width="3" stroke-linejoin="round">
      <path d="M -5 10 L 15 20 L 45 20 L 60 10 Z" fill="#FFB199"/>
      <path d="M 22 12 L 27 2 L 32 12 Z" fill="#FFD166"/>
      <circle cx="27" cy="10" r="4" fill="#F5F1FF"/>
      <circle cx="12" cy="15" r="4.5" fill="#7FE7C4"/>
      <circle cx="18" cy="16" r="4.5" fill="#FF8FB1"/>
      <circle cx="36" cy="16" r="4.5" fill="#FFD166"/>
      <circle cx="44" cy="15" r="4.5" fill="#7FE7C4"/>
    </g>

    <!-- Cute Elephant (Moved slightly to the right to avoid overlapping left border) -->
    <g transform="translate(18 85)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <path d="M 40 30 C 65 10, 75 55, 40 65 Z" fill="#A8B4D4"/>
      <path d="M 20 30 C -5 10, -15 55, 20 65 Z" fill="#C0C9E0"/>
      <path d="M 18 35 C 2 22, -2 50, 18 57 Z" fill="#FFBFD1" stroke="none"/>
      <circle cx="30" cy="40" r="20" fill="#C0C9E0"/>
      <path d="M 30 50 C 30 70, 15 80, 5 70 C 3 82, 20 88, 40 65 Z" fill="#C0C9E0"/>
      <circle cx="20" cy="35" r="2.5" fill="#2B2540" stroke="none"/>
      <circle cx="40" cy="35" r="2.5" fill="#2B2540" stroke="none"/>
      <ellipse cx="12" cy="42" rx="4" ry="2.5" fill="#FFBFD1" stroke="none"/>
      <ellipse cx="48" cy="42" rx="4" ry="2.5" fill="#FFBFD1" stroke="none"/>
    </g>

    <!-- Tuk-Tuk (Flipped to face inwards) -->
    <g transform="translate(195 95) scale(-1, 1)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <circle cx="15" cy="45" r="7" fill="#2B2540"/>
      <circle cx="15" cy="45" r="2.5" fill="#FFFFFF" stroke="none"/>
      <circle cx="45" cy="45" r="7" fill="#2B2540"/>
      <circle cx="45" cy="45" r="2.5" fill="#FFFFFF" stroke="none"/>
      <path d="M 5 20 h 20 v 25 h -20 z" fill="#FF8FB1"/>
      <path d="M 25 25 h 12 l 8 15 v 5 h -20 z" fill="#9DB4FF"/>
      <path d="M 27 25 h 7 l 5 10 h -12 z" fill="#F5F1FF"/>
      <path d="M -2 20 h 25 c 2 0, 5 -5, 10 -5 h 4 c -5 0, -8 5, -10 5 h -20 z" fill="#FFD166"/>
      <circle cx="48" cy="36" r="3.5" fill="#FFF8F2"/>
    </g>
  </g>

  <!-- Trip label (Moved outside clipPath to overlap border) -->
  <g transform="translate(73 145)">
    <rect width="113" height="27" rx="13.5" fill="#B49CFF" stroke="#2B2540" stroke-width="4"/>
    <text x="56.5" y="18.5" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">TRIP 04</text>
  </g>

  <!-- Country ribbon (Moved outside clipPath to overlap border) -->
  <g transform="translate(53 176)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
    <path d="M8 0H107V27H8L0 13.5Z" fill="#FF8FB1"/>
    <path d="M107 0l9 13.5l-9 13.5Z" fill="#E87599"/>
    <text x="58" y="18.5" text-anchor="middle" fill="#FFFFFF" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="2.2">THAILAND</text>
  </g>

  <!-- Tiny travel accents (Moved slightly inward) -->
  <g fill="#FFD166" stroke="#2B2540" stroke-width="2.5" stroke-linejoin="round">
    <path d="M48 65 l3 6 l7 1 l-5 5 l1 7 l-6-3 l-6 3 l1-7 l-5-5 l7-1 Z"/>
    <path d="M172 80 l3 6 l7 1 l-5 5 l1 7 l-6-3 l-6 3 l1-7 l-5-5 l7-1 Z"/>
  </g>
  <g fill="#FF8FB1" opacity=".8">
    <ellipse cx="32" cy="155" rx="5" ry="2.5" transform="rotate(-28 32 155)"/>
    <ellipse cx="188" cy="140" rx="5" ry="2.5" transform="rotate(32 188 140)"/>
  </g>

  <!-- Clean rubber-stamp imperfections -->
  <g fill="#2B2540" opacity=".1">
    <circle cx="20" cy="113" r="2"/>
    <circle cx="50" cy="42" r="1.6"/>
    <circle cx="168" cy="39" r="2"/>
    <circle cx="201" cy="114" r="1.7"/>
    <circle cx="153" cy="198" r="1.8"/>
    <path d="M79 18h13v2H79ZM126 207h16v2h-16ZM13 140h11v2H13Z"/>
  </g>
</svg>
