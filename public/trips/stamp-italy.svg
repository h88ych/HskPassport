<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="stampItalyTitle stampItalyDesc">
  <title id="stampItalyTitle">Trip 06 Italy Passport Stamp</title>
  <desc id="stampItalyDesc">A collectible pastel passport stamp featuring the Colosseum, a cute Vespa, gelato, pizza, and lemons.</desc>
  <defs>
    <!-- Sky Gradient matching the pastel lavender/peach series -->
    <linearGradient id="stampItalyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F2"/>
      <stop offset=".55" stop-color="#F5F1FF"/>
      <stop offset="1" stop-color="#FFEAD1"/>
    </linearGradient>
    
    <filter id="stampItalyShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#665B88" flood-opacity=".18"/>
    </filter>
    
    <pattern id="stampItalyTexture" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.2" fill="#2B2540" opacity=".08"/>
      <circle cx="13" cy="11" r=".9" fill="#2B2540" opacity=".07"/>
    </pattern>
    
    <clipPath id="stampItalyClip">
      <circle cx="110" cy="110" r="96.5"/>
    </clipPath>
  </defs>

  <!-- Collectible stamp base (Matched sizes to Japan/China stamps) -->
  <circle cx="110" cy="110" r="104" fill="#FFFFFF" filter="url(#stampItalyShadow)"/>
  <circle cx="110" cy="110" r="100" fill="url(#stampItalyBg)" stroke="#A38AF5" stroke-width="7"/>
  <circle cx="110" cy="110" r="88" fill="none" stroke="#FF88AE" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round"/>
  <circle cx="110" cy="110" r="78" fill="#FFFFFF" opacity=".42"/>
  
  <g clip-path="url(#stampItalyClip)">
    <!-- Base Texture overlay -->
    <rect x="8" y="8" width="204" height="204" fill="url(#stampItalyTexture)"/>
    
    <!-- Warm Mediterranean Sun -->
    <circle cx="110" cy="70" r="35" fill="#FFD166" opacity=".25"/>

    <!-- Clouds -->
    <path d="M 160 40 a 8 8 0 0 1 16 0 a 12 12 0 0 1 20 0 a 8 8 0 0 1 8 8 h -44 a 8 8 0 0 1 0 -8 Z" fill="#FFFFFF" opacity=".8"/>
    <path d="M 30 65 a 10 10 0 0 1 20 0 a 15 15 0 0 1 25 0 a 10 10 0 0 1 10 10 h -55 a 10 10 0 0 1 0 -10 Z" fill="#FFFFFF" opacity=".9"/>

    <!-- Distant hills -->
    <path d="M -10 120 Q 50 100 110 115 T 230 110 L 230 220 L -10 220 Z" fill="#E4FBF3"/>

    <!-- Italian Cypress Trees -->
    <g stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <path d="M 30 115 L 40 45 L 50 115 Z" fill="#7FE7C4"/>
      <path d="M 180 120 L 188 60 L 196 120 Z" fill="#9DB4FF"/>
      <path d="M 165 125 L 172 75 L 179 125 Z" fill="#7FE7C4"/>
    </g>

    <!-- Colosseum (Focal Point) -->
    <g transform="translate(55 35)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <!-- Back wall -->
      <path d="M 15 90 L 15 35 Q 55 20 95 35 L 95 90 Z" fill="#FFB199"/>
      <!-- Back tier arches -->
      <rect x="25" y="45" width="8" height="12" rx="4" fill="#E87599"/>
      <rect x="42" y="40" width="8" height="12" rx="4" fill="#E87599"/>
      <rect x="59" y="40" width="8" height="12" rx="4" fill="#E87599"/>
      <rect x="76" y="45" width="8" height="12" rx="4" fill="#E87599"/>
      
      <!-- Middle tier -->
      <path d="M 30 90 L 30 50 Q 55 55 80 50 L 80 90 Z" fill="#FFD166"/>
      <!-- Middle tier arches -->
      <rect x="36" y="60" width="8" height="14" rx="4" fill="#FFB199"/>
      <rect x="51" y="62" width="8" height="14" rx="4" fill="#FFB199"/>
      <rect x="66" y="60" width="8" height="14" rx="4" fill="#FFB199"/>

      <!-- Front tier -->
      <path d="M 5 90 L 5 65 Q 55 80 105 65 L 105 90 Z" fill="#FFF8F2"/>
      <!-- Front tier arches -->
      <rect x="18" y="73" width="10" height="17" rx="5" fill="#B49CFF"/>
      <rect x="36" y="76" width="10" height="17" rx="5" fill="#B49CFF"/>
      <rect x="54" y="78" width="10" height="17" rx="5" fill="#B49CFF"/>
      <rect x="72" y="76" width="10" height="17" rx="5" fill="#B49CFF"/>
      <rect x="90" y="73" width="10" height="17" rx="5" fill="#B49CFF"/>
    </g>

    <!-- Ground / Midground -->
    <path d="M -10 125 Q 110 115 230 130 L 230 220 L -10 220 Z" fill="#DDF8EE"/>
    <path d="M -10 145 Q 110 135 230 155 L 230 220 L -10 220 Z" fill="#A8E6CF"/>

    <!-- Hanging Lemons (Top Left) -->
    <g transform="translate(5, 5)" stroke="#2B2540" stroke-width="3" stroke-linejoin="round">
      <path d="M -10 5 Q 15 25 45 5" fill="none"/>
      <path d="M 5 15 Q 15 5 25 15 Q 15 25 5 15 Z" fill="#7FE7C4"/>
      <path d="M 25 5 Q 35 -5 45 5 Q 35 15 25 5 Z" fill="#7FE7C4"/>
      <circle cx="18" cy="25" r="7" fill="#FFD166"/>
      <circle cx="35" cy="15" r="7" fill="#FFD166"/>
      <circle cx="21" cy="27" r="1.5" fill="#FFB199" stroke="none"/>
      <circle cx="38" cy="17" r="1.5" fill="#FFB199" stroke="none"/>
    </g>

    <!-- Italian Cafe Table (Foreground Left) -->
    <g transform="translate(5 110)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <!-- Table Base -->
      <path d="M 40 52 v 60" fill="none" stroke-width="6"/>
      <path d="M 20 110 h 40" fill="none" stroke-width="6" stroke-linecap="round"/>
      <!-- Table Top -->
      <ellipse cx="40" cy="40" rx="45" ry="12" fill="#FF8FB1"/>
      <!-- Pizza -->
      <ellipse cx="25" cy="35" rx="18" ry="6" fill="#F5F1FF"/>
      <path d="M 15 35 L 35 25 L 30 40 Z" fill="#FFD166"/>
      <path d="M 15 35 L 35 25" stroke="#FFB199" stroke-width="4" stroke-linecap="round"/>
      <circle cx="24" cy="32" r="2" fill="#E87599" stroke="none"/>
      <circle cx="28" cy="36" r="1.5" fill="#E87599" stroke="none"/>
      <circle cx="19" cy="35" r="1.5" fill="#E87599" stroke="none"/>
      <!-- Gelato -->
      <path d="M 50 25 L 55 40 H 65 L 70 25 Z" fill="#9DB4FF"/>
      <circle cx="55" cy="20" r="7.5" fill="#FFF8F2"/>
      <circle cx="65" cy="20" r="7.5" fill="#7FE7C4"/>
      <circle cx="60" cy="12" r="7.5" fill="#FF8FB1"/>
      <!-- Cherry -->
      <circle cx="60" cy="4" r="3.5" fill="#FFD166"/>
    </g>

    <!-- Vespa Scooter (Foreground Right) -->
    <g transform="translate(125 110)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
      <!-- Wheels -->
      <circle cx="18" cy="40" r="10" fill="#F5F1FF"/>
      <circle cx="65" cy="40" r="10" fill="#F5F1FF"/>
      <circle cx="18" cy="40" r="3" fill="#2B2540" stroke="none"/>
      <circle cx="65" cy="40" r="3" fill="#2B2540" stroke="none"/>
      
      <!-- Body Front Shield -->
      <path d="M 10 40 Q 8 15 25 10 L 32 40 Z" fill="#7FE7C4"/>
      
      <!-- Body Floor & Rear -->
      <path d="M 25 35 L 45 35 Q 55 15 68 20 Q 80 25 72 40 L 62 40 Q 52 25 40 40 Z" fill="#7FE7C4"/>
      
      <!-- Seat -->
      <path d="M 45 20 L 48 15 H 65 L 70 20 Z" fill="#FF8FB1"/>
      
      <!-- Handlebar -->
      <path d="M 22 10 L 18 0 L 10 0" fill="none"/>
      <circle cx="10" cy="0" r="3.5" fill="#FFD166" stroke="none"/>
      <!-- Headlight -->
      <circle cx="22" cy="0" r="4" fill="#FFF8F2"/>
    </g>
  </g>

  <!-- Trip label (Moved outside clipPath to overlap border) -->
  <g transform="translate(73 145)">
    <rect width="113" height="27" rx="13.5" fill="#B49CFF" stroke="#2B2540" stroke-width="4"/>
    <text x="56.5" y="18.5" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">TRIP 06</text>
  </g>

  <!-- Country ribbon (Moved outside clipPath to overlap border) -->
  <g transform="translate(53 176)" stroke="#2B2540" stroke-width="4" stroke-linejoin="round">
    <path d="M8 0H107V27H8L0 13.5Z" fill="#FF8FB1"/>
    <path d="M107 0l9 13.5l-9 13.5Z" fill="#E87599"/>
    <text x="58" y="18.5" text-anchor="middle" fill="#FFFFFF" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="2.2">ITALY</text>
  </g>

  <!-- Tiny travel accents (Matched style) -->
  <g fill="#FFD166" stroke="#2B2540" stroke-width="2.5" stroke-linejoin="round">
    <path d="M35 85 l3 6 l7 1 l-5 5 l1 7 l-6-3 l-6 3 l1-7 l-5-5 l7-1 Z"/>
    <path d="M175 75 l3 6 l7 1 l-5 5 l1 7 l-6-3 l-6 3 l1-7 l-5-5 l7-1 Z"/>
  </g>
  <g fill="#FF8FB1" opacity=".8">
    <ellipse cx="40" cy="125" rx="5" ry="2.5" transform="rotate(-20 40 125)"/>
    <ellipse cx="190" cy="150" rx="5" ry="2.5" transform="rotate(35 190 150)"/>
  </g>

  <!-- Clean rubber-stamp imperfections (Identical to previous) -->
  <g fill="#2B2540" opacity=".1">
    <circle cx="20" cy="113" r="2"/>
    <circle cx="50" cy="42" r="1.6"/>
    <circle cx="168" cy="39" r="2"/>
    <circle cx="201" cy="114" r="1.7"/>
    <circle cx="153" cy="198" r="1.8"/>
    <path d="M79 18h13v2H79ZM126 207h16v2h-16ZM13 140h11v2H13Z"/>
  </g>
</svg>
